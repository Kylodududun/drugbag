<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>藥跟你說</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a phone-width dispensing app; the medication card borrows the 早/中/晚/睡前 grid printed on Taiwanese drug bags. */
:root{
  --paper:#f6f7f4; --card:#ffffff; --ink:#18231f; --ink2:#55615b; --line:#d9ded8;
  --rx:#1f6f5c; --rx-soft:#e3efe9; --alert:#b3261e; --alert-soft:#fbe9e7; --amber:#8a5a00; --amber-soft:#fdf1d8;
  --pill-a:#ffffff; --pill-b:#f3e3b5; --pill-c:#f7d4d1;
  --f-latin:"Be Vietnam Pro","Noto Sans TC",system-ui,sans-serif;
  --f-zh:"Noto Sans TC","Be Vietnam Pro",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111816; --card:#1a2320; --ink:#e7ece9; --ink2:#a5b1ab; --line:#2f3b37;
  --rx:#5cc2a3; --rx-soft:#1d3a31; --alert:#ff8a80; --alert-soft:#3a1f1d; --amber:#f2c26b; --amber-soft:#3a2f17;
  --pill-a:#e9ece9; --pill-b:#e0cd95; --pill-c:#e8b9b5; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111816; --card:#1a2320; --ink:#e7ece9; --ink2:#a5b1ab; --line:#2f3b37;
  --rx:#5cc2a3; --rx-soft:#1d3a31; --alert:#ff8a80; --alert-soft:#3a1f1d; --amber:#f2c26b; --amber-soft:#3a2f17;
  --pill-a:#e9ece9; --pill-b:#e0cd95; --pill-c:#e8b9b5; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-zh);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;text-wrap:balance;letter-spacing:.02em}
.demo{font-size:12.5px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px 10px}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:500;padding:8px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--rx);color:var(--card)}
.seg.small button{font-size:13.5px;padding:7px 4px}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--rx);outline-offset:2px}
.lang{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px var(--f-latin);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--rx);background:var(--rx-soft);color:var(--rx)}
.lat{font-family:var(--f-latin)}
.who{font-size:13px;color:var(--ink2)}
.drug{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dh{display:flex;gap:12px;align-items:center}
.pill{flex:none;width:52px;height:52px;border-radius:12px;background:var(--rx-soft);display:grid;place-items:center}
.pill i{display:block;border:1.5px solid var(--ink2)}
.dn{min-width:0}
.dn b{font:600 16px var(--f-latin);display:block}
.dn span{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.purpose{font-size:15.5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grid div{text-align:center;padding:6px 2px;font-size:12px;color:var(--ink2);border-left:1px solid var(--line)}
.grid div:first-child{border-left:0}
.grid div.on{background:var(--rx);color:var(--card);font-weight:600}
.grid div b{display:block;font:600 15px var(--f-mono)}
.meal{font-size:13px;color:var(--rx);font-weight:600}
.k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:2px}
.warn{background:var(--alert-soft);border-radius:10px;padding:10px 12px;color:var(--alert)}
.warn .k{color:var(--alert)}
.tip{font-size:13.5px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:500 13.5px var(--f-latin);cursor:pointer}
.btn.pri{background:var(--rx);border-color:var(--rx);color:var(--card)}
.btn.done{background:var(--rx-soft);border-color:var(--rx-soft);color:var(--rx)}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.slot h3{margin:0;font:600 15px var(--f-latin);display:flex;justify-content:space-between;gap:8px}
.slot h3 span{font-family:var(--f-mono);color:var(--ink2);font-weight:500}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px}
.it .t{min-width:0}
.it small{display:block;color:var(--ink2);font-size:12px}
.help{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font:500 14px var(--f-latin);cursor:pointer;min-height:56px}
.help button.red{border-color:var(--alert)}
.help button[aria-pressed="true"]{background:var(--rx-soft);border-color:var(--rx)}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bubble{background:var(--rx-soft);border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:14px;white-space:pre-line}
.em{background:var(--alert);color:var(--card);border-radius:10px;padding:10px 12px;font-weight:600}
.sum{display:flex;align-items:baseline;gap:8px}
.sum b{font:600 34px var(--f-mono);color:var(--rx)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rx);border-radius:4px;transition:width .3s}
.fam li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.fam{list-style:none;margin:0;padding:0}
.st{font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--rx-soft);color:var(--rx)} .st.wait{background:var(--amber-soft);color:var(--amber)}
.label{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.label .t{min-width:0;font-size:13px}
.label .t b{font-size:15px}
#qr{background:#fff;padding:6px;border-radius:4px;width:118px;height:118px}
#qr img,#qr canvas{width:106px!important;height:106px!important}
.note{font-size:12.5px;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.free{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.free textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:10px;font:15px var(--f-latin);background:var(--paper);color:var(--ink);resize:vertical}
.free textarea:focus-visible{outline:2px solid var(--rx);outline-offset:1px}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex button{border:1px dashed var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:4px 10px;font:12.5px var(--f-latin);cursor:pointer;text-align:left}
.tri{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px}
.tri dt{color:var(--ink2)} .tri dd{margin:0;min-width:0}
.conf{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px}
.conf.h{background:var(--rx-soft);color:var(--rx)} .conf.m{background:var(--amber-soft);color:var(--amber)} .conf.l{background:var(--alert-soft);color:var(--alert)}
mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1>藥跟你說</h1>
    <div class="demo">原型示範：病人、藥局皆為虛構；外文內容尚未經母語醫療譯者審訂，不可作為實際用藥依據。</div>
  </header>

  <div class="seg" role="group" aria-label="切換角色">
    <button id="r-caregiver" data-role="caregiver" aria-pressed="true">看護端</button>
    <button id="r-family" data-role="family" aria-pressed="false">家屬端</button>
    <button id="r-pharm" data-role="pharm" aria-pressed="false">藥師端</button>
  </div>

  <!-- 看護端 -->
  <section id="v-caregiver" class="wrap" style="gap:12px">
    <div class="lang" role="group" aria-label="Language">
      <button class="chip" id="l-id" data-lang="id" aria-pressed="true">Bahasa Indonesia</button>
      <button class="chip" id="l-vi" data-lang="vi" aria-pressed="false">Tiếng Việt</button>
      <button class="chip" id="l-zh" data-lang="zh" aria-pressed="false">中文</button>
    </div>
    <div class="who lat" id="who"></div>
    <div class="seg small" role="group" aria-label="功能">
      <button id="t-card" data-tab="card" aria-pressed="true"></button>
      <button id="t-sched" data-tab="sched" aria-pressed="false"></button>
      <button id="t-help" data-tab="help" aria-pressed="false"></button>
    </div>
    <div id="p-card" class="wrap" style="gap:12px"></div>
    <div id="p-sched" class="wrap" style="gap:12px" hidden></div>
    <div id="p-help" class="wrap" style="gap:12px" hidden></div>
  </section>

  <!-- 家屬端 -->
  <section id="v-family" class="wrap" style="gap:12px" hidden>
    <div class="card">
      <div class="k">今日服藥進度・王○○ 阿嬤</div>
      <div class="sum"><b id="f-n">0/4</b><span class="note">次給藥已完成</span></div>
      <div class="bar"><i id="f-bar" style="width:0%"></i></div>
      <ul class="fam" id="f-list"></ul>
      <div class="note">看護在看護端按下確認後，這裡會即時更新。</div>
    </div>
    <div class="card">
      <div class="k">看護回報</div>
      <div id="f-alerts" class="note">目前沒有回報。可到看護端的求助頁試試。</div>
    </div>
    <div class="card">
      <div class="k">LINE 每日摘要預覽（晚上 9 點）</div>
      <div class="bubble" id="f-line"></div>
    </div>
  </section>

  <!-- 藥師端 -->
  <section id="v-pharm" class="wrap" style="gap:12px" hidden>
    <div class="card">
      <div class="k">調劑時加貼的標籤</div>
      <div class="note">藥師在交付藥品前選擇看護的語言，系統印出這張貼紙，貼在藥袋上。</div>
      <div class="lang" role="group" aria-label="標籤語言">
        <button class="chip" id="pl-id" data-plang="id" aria-pressed="true">印尼文</button>
        <button class="chip" id="pl-vi" data-plang="vi" aria-pressed="false">越南文</button>
      </div>
    </div>
    <div class="label">
      <div class="t">
        <b class="lat" id="lab-h"></b><br>
        <span class="lat" id="lab-s"></span><br>
        <span style="font-family:var(--f-mono);font-size:12px">示範藥局・3 項藥品・28 天</span>
      </div>
      <div id="qr" aria-label="掃描開啟看護端"></div>
    </div>
    <div class="note">掃描 QR Code 會開啟看護端畫面。正式版的 QR Code 只連到藥品資訊與一次性憑證，不含姓名或病歷。</div>
  </section>
</div>

}

const MV = new Map(MDL.vocab.map((g,i)=>[g,i]));
function grams(text){const out=[];for(const tok of norm(text).split(" ")){if(!tok)continue;const t=" "+tok+" ";
  if(/[一-鿿]/.test(tok))for(const ch of tok)out.push(ch);
  for(const n of [2,3,4])for(let i=0;i+n<=t.length;i++)out.push(t.slice(i,i+n));}return out}
function mdlProb(text){const c=new Map();for(const g of grams(text)){const i=MV.get(g);if(i!==undefined)c.set(i,(c.get(i)||0)+1)}
  let s=0;const x=[];for(const [i,k] of c){const v=(1+Math.log(k))*MDL.idf[i];x.push([i,v]);s+=v*v}s=Math.sqrt(s)||1;
  const z=MDL.coef.map((w,j)=>x.reduce((a,[i,v])=>a+w[i]*v/s,MDL.bias[j]));const mx=Math.max(...z);
  const e=z.map(v=>Math.exp(v-mx));const se=e.reduce((a,b)=>a+b,0);return e.map(v=>v/se)}
function triage2(text){
  const k=triage(text);
  if(k.top&&k.top.c.red) return {...k,src:"rule"};
  const p=mdlProb(text);const cat=l=>TRIAGE.find(c=>c.k===l);
  const ranked=MDL.labels.map((l,i)=>({l,p:p[i]})).sort((a,b)=>b.p-a.p);
  const redP=ranked.filter(r=>MDL.red.includes(r.l)).reduce((a,r)=>a+r.p,0);
  const pct=v=>Math.round(v*100)+"%";
  const all=ranked.filter(r=>r.l!=="other"&&r.p>=0.08).map(r=>({c:cat(r.l),sc:r.p,hits:["分類模型 "+pct(r.p)]}));
  if(redP>=MDL.tau_red){const r=ranked.find(r=>MDL.red.includes(r.l));
    return {top:{c:cat(r.l),sc:redP,hits:["分類模型：警訊類合計 "+pct(redP)]},conf:"m",all,src:"model-red"}}
  const t=ranked[0];
  if(t.l==="other"||t.p<MDL.tau) return {top:null,conf:"l",all,src:"refer"};
  return {top:{c:cat(t.l),sc:t.p,hits:["分類模型 "+pct(t.p)]},conf:t.p>=0.6?"h":"m",all:[{c:cat(t.l)},...all.filter(a=>a.c.k!==t.l)],src:"model"};
}

      <div class="note lat">${esc(t.sent)}</div><div class="bubble" id="f-msg">${esc(msg)}</div>
      <div class="note">示範版：紅旗關鍵字安全規則＋字元 n-gram 分類模型（以合成標註語句訓練，尚未以真實使用者資料驗證）。高風險一律提示就醫，低信心轉藥師人工判讀。</div></div>`;}
  $("p-help").innerHTML=`<div class="k lat">${esc(t.helpQ)}</div><div class="help">${HELP.map(h=>`<button class="${h.red?"red":""}" data-help="${h.k}" aria-pressed="${S.help===h.k}">${esc(lab(h))}</button>`).join("")}</div>${out}
    <div class="free"><label class="k lat" for="h-free">${esc(t.freeQ)}</label>
      <textarea id="h-free" class="lat" placeholder="${esc(t.freePh)}">${esc(S.ftext)}</textarea>
      <div class="ex">${t.ex.map(e=>`<button data-ex="${esc(e)}">${esc(e)}</button>`).join("")}</div>
      <div class="row"><button class="btn pri" id="h-go">${esc(t.analyze)}</button></div></div>${tri}`;
  $("p-help").querySelectorAll("[data-help]").forEach(b=>b.onclick=()=>{S.help=b.dataset.help;const h=HELP.find(x=>x.k===S.help);S.alerts.unshift({t:now(),h});renderHelp();renderFamily()});
  $("p-help").querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{$("h-free").value=b.dataset.ex});
  $("h-go").onclick=()=>{const v=$("h-free").value.trim();if(!v)return;S.ftext=v;S.tri=triage2(v);S.help=null;
    const top=S.tri.top;S.alerts.unshift({t:now(),h:{zh:(top?top.c.zh:"無法判斷，待藥師判讀")+"（自由描述）",red:top&&top.c.red}});renderHelp();renderFamily()};
  const c=$("h-copy"); if(c) c.onclick=()=>{const txt=$("h-msg").textContent;
    const done=()=>{c.textContent=T[S.lang].copied};
    try{navigator.clipboard.writeText(txt).then(done,()=>selectText($("h-msg")))}catch(e){selectText($("h-msg"))}};
}
function freeMsg(text,r){const top=r.top;return `【用藥求助・自由描述】${now()}\n服藥者：王○○ 阿嬤\n系統判斷：${top?top.c.zh:"無法判斷"}（信心${({h:"高",m:"中",l:"低"})[r.conf]}）${top&&top.c.red?"\n⚠ 警訊症狀，已提示看護立即就醫或撥打 119。":""}${r.conf==="l"?"\n已轉藥師人工判讀。":""}\n看護原文：${text}\n（原文請由藥師或母語人員確認）`}
function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function helpMsg(h){return `【用藥求助】${now()}\n服藥者：王○○ 阿嬤\n看護回報：${h.zh}${h.red?"\n⚠ 此為警訊症狀，已提示看護立即就醫或撥打 119。":""}\n目前用藥：Amlodipine、Metformin、Aspirin`}
function renderFamily(){
  const done=SCHED.filter(s=>S.given[s.key]).length;
  $("f-n").textContent=`${done}/${SCHED.length}`; $("f-bar").style.width=`${done/SCHED.length*100}%`;
  $("f-list").innerHTML=SCHED.map(s=>{const g=S.given[s.key];return `<li><span>${s.time}　${drug(s.drug).name}（${drug(s.drug).zh_.p}）</span><span class="st ${g?"ok":"wait"}">${g?"已給 "+g:"待給藥"}</span></li>`}).join("");
  $("f-alerts").innerHTML=S.alerts.length?S.alerts.slice(0,4).map(a=>`<div style="color:${a.h.red?"var(--alert)":"var(--ink)"}">${a.t}　${esc(a.h.zh)}${a.h.red?"（警訊）":""}</div>`).join(""):"目前沒有回報。可到看護端的求助頁試試。";
  const miss=SCHED.filter(s=>!S.given[s.key]).map(s=>`${s.time} ${drug(s.drug).name}`);
  $("f-line").textContent=`王○○ 阿嬤今日用藥摘要\n已完成 ${done}/${SCHED.length} 次給藥${miss.length?`\n尚未確認：${miss.join("、")}`:"\n全部按時完成"}\n看護回報 ${S.alerts.length} 則${S.alerts.some(a=>a.h.red)?"，含警訊，請盡快聯絡":""}`;
}
function renderCaregiver(){
  const t=T[S.lang];$("who").textContent=t.who;
  ["card","sched","help"].forEach((k,i)=>{$("t-"+k).textContent=t.tabs[i];$("p-"+k).hidden=S.tab!==k});
  press("[data-tab]","tab",S.tab);press("[data-lang]","lang",S.lang);
  renderCards();renderSched();renderHelp();
}
let qr=null;
function renderPharm(){
  press("[data-plang]","plang",S.plang);
  const t=T[S.plang];
  $("lab-h").textContent=S.plang==="id"?"Pindai untuk info obat":"Quét để xem thông tin thuốc";
  $("lab-s").textContent=S.plang==="id"?"Bahasa Indonesia · Nenek Wang ○○":"Tiếng Việt · Bà Vương ○○";
  const url=(SHARE_URL||location.href.split("#")[0])+"#"+S.plang;
  try{$("qr").innerHTML="";qr=new QRCode($("qr"),{text:url,width:106,height:106,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){$("qr").textContent="QR"}
}
function setRole(r){S.role=r;press("[data-role]","role",r);["caregiver","family","pharm"].forEach(k=>$("v-"+k).hidden=k!==r);if(r==="pharm")renderPharm();if(r==="family")renderFamily()}
document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>setRole(b.dataset.role));
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;renderCaregiver()});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;try{localStorage.setItem("pl-lang",S.lang)}catch(e){};renderCaregiver()});
document.querySelectorAll("[data-plang]").forEach(b=>b.onclick=()=>{S.plang=b.dataset.plang;renderPharm()});
const h=(location.hash||"").slice(1);
if(h==="id"||h==="vi"){S.lang=h} else if(h==="family"||h==="pharm"){S.role=h}
renderCaregiver();renderFamily();setRole(S.role);
</script>
